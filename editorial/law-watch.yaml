# 待觀察修法清單 —— 法規巡檢 agent 每月檢查這些項目是否已公布施行。
# 一旦生效，就要回頭改所有受影響的文章與試算工具。
# status: pending=三讀通過待公布 / effective=已施行（處理完就刪除本筆）/ watching=草案階段僅觀察
watch:
  - id: annual-exemption-adjustment
    passed_date: null
    title: 遺產稅／贈與稅免稅額、扣除額、課稅級距的年度調整
    status: watching
    what_changed: |
      依遺贈稅法規定，免稅額、扣除額與課稅級距在消費者物價指數較上次調整年度
      累計上漲達 10% 以上時調升。財政部通常在前一年 11–12 月公告次年度適用金額。
      115 年度（2026）維持：遺產稅免稅額 1,333 萬、贈與稅免稅額 244 萬。
      2026-11-01 查證：財政部尚未正式公告 116 年度（2027）金額；媒體依今年
      CPI 累計漲幅（約 11.5%，已超過法定 10% 門檻）試算，遺產稅免稅額可能調高
      至約 1,488 萬、贈與稅免稅額約 272 萬，但官方表示要等主計總處公布數據後
      精算，預計年底前公告、次年 1/1 起適用——這只是媒體估算，未正式公告前
      不要把它寫成網站上的確定數字。
    affects:
      - src/pages/tools/estate-tax.astro
      - src/pages/tools/gift-tax.astro
      - src/pages/services.astro
      - src/pages/index.astro
    check: 每年 11 月起加強查證財政部公告的次年度金額；跨年時全站數字要同步更新。
    source: https://www.dot.gov.tw/
